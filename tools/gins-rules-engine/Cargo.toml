[package]
name = "gins-rules-engine"
version = "2.0.0"
edition = "2024"
description = "High-performance rule parser and text format generator for Gins-Rules"

[[bin]]
name = "gins-rules-engine"
path = "src/main.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"

# String interning
compact_str = { version = "0.8", features = ["serde"] }

# Async & Networking
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Parallelism
rayon = "1.10"
dashmap = { version = "6.0", features = ["rayon"] }

# File IO
memmap2 = "0.9"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Time
chrono = "0.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
