[workspace]
members = [
    "Gins-Rules-Core",
    "Gins-Rules-Syncer",
    "Gins-Rules-Compiler"
]
resolver = "2"

[workspace.dependencies]
# Serialization & Data
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
yams = "0.0.1" # wait, yams is swift. In Rust, we use serde_yaml
serde_yaml = "0.9"

# String Interning
ecow = { version = "0.2", features = ["serde"] }

# Async & Networking
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Parallelism
rayon = "1.10"
dashmap = { version = "6.0", features = ["rayon"] }
ahash = "0.8"

# File IO & CLI
memmap2 = "0.9"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"

# Binary / Protobuf
byteorder = "1.5"
prost = "0.13"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
