name: Build and Deploy

on:
  schedule:
    - cron: "28 23 * * *"
    - cron: "16 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 26 & pnpm 11
        run: |
          corepack enable
          corepack prepare pnpm@11.0.9 --activate

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile --aggregate-output

      - name: Sync & Compile (Swift Native)
        run: |
          # Use Swift 6.3 directly from the runner
          pnpm sync
          pnpm icons
          pnpm compile

      - name: Commit Synced Metadata
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add source/upstream compiled/Gins-Icons.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: metadata sync [skip ci]" && git pull --rebase -X theirs origin main && git push)

      - name: Build Dashboard (Astro 6.3)
        run: |
          cd dashboard
          pnpm install --no-frozen-lockfile
          pnpm build
          cp -r dist/* ../compiled/

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync compiled/ s3://gins-rules-storage/ --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com --delete
          npx wrangler deploy --config cmd/scanner/wrangler.jsonc
