name: Build and Deploy

on:
  schedule:
    - cron: "28 23 * * *"
    - cron: "16 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE26: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer || true

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.0.9 --activate

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies (Root)
        run: pnpm install --no-frozen-lockfile

      - name: Fetch Latest Tool Versions
        id: tool-versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          fetch_releases() {
            local repo="$1"
            local output="$2"
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -A "Gins-Rules-Workflow" \
              "https://api.github.com/repos/${repo}/releases?per_page=100" \
              -o "$output"

            if ! jq -e 'type == "array"' "$output" >/dev/null; then
              echo "Error: Failed to fetch releases for $repo"
              exit 1
            fi
          }

          fetch_releases "SagerNet/sing-box" singbox-releases.json
          fetch_releases "MetaCubeX/mihomo" mihomo-releases.json

          SINGBOX_URL=$(jq -r '
            map(select(.prerelease == true))
            | .[0].assets[]
            | select(.name | contains("darwin-arm64") and endswith(".tar.gz"))
            | .browser_download_url
          ' singbox-releases.json | head -n 1)

          MIHOMO_URL=$(jq -r '
            (
              [
                .[]
                | select(.tag_name == "Prerelease-Alpha" or .tag_name == "alpha")
                | .assets[]
                | select(.name | test("^mihomo-darwin-arm64(-v[123])?(-go[0-9]+)?-alpha-.*\\.gz$"))
                | .browser_download_url
              ] +
              [
                .[]
                | select(.prerelease == false)
                | .assets[]
                | select(.name | test("^mihomo-darwin-arm64-v[0-9]+\\.[0-9]+\\.[0-9]+\\.gz$"))
                | .browser_download_url
              ]
            )[0] // empty
          ' mihomo-releases.json)

          echo "singbox_url=$SINGBOX_URL" >> $GITHUB_OUTPUT
          echo "mihomo_url=$MIHOMO_URL" >> $GITHUB_OUTPUT
          echo "cache_key=$(echo -n "$SINGBOX_URL-$MIHOMO_URL" | shasum -a 256 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Cache Binaries
        id: cache-bin
        uses: actions/cache@v5
        with:
          path: bin/
          key: ${{ runner.os }}-binaries-${{ steps.tool-versions.outputs.cache_key }}

      - name: Sync Data (Rules, Icons, ASN, Geo)
        run: |
          mkdir -p compiled/ruleset
          swift run --package-path tools gins-rules-syncer --root . sync
          swift run --package-path tools gins-rules-syncer --root . icons
          swift run --package-path tools gins-rules-syncer --root . he
          swift run --package-path tools gins-rules-syncer --root . geo

      - name: Commit Synced Rules
        id: sync
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto sync upstream rules and parsers [skip ci]"
            for i in {1..5}; do
              git pull --rebase -X theirs origin main && git push && break || sleep 5
            done
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Compilers (Bleeding Edge Alpha)
        if: (steps.sync.outputs.changed == 'true' || github.event_name != 'schedule') && steps.cache-bin.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p bin
          SINGBOX_URL="${{ steps.tool-versions.outputs.singbox_url }}"
          curl -sL "$SINGBOX_URL" | tar xz --strip-components=1
          mv sing-box bin/
          MIHOMO_URL="${{ steps.tool-versions.outputs.mihomo_url }}"
          if [[ "$MIHOMO_URL" == *.gz ]]; then
            curl -sL "$MIHOMO_URL" | gunzip > bin/mihomo
          elif [[ "$MIHOMO_URL" == *.zip ]]; then
            curl -sL -o mihomo.zip "$MIHOMO_URL"
            unzip -o mihomo.zip
            mv mihomo-darwin-arm64* bin/mihomo
          fi
          chmod +x bin/sing-box bin/mihomo

      - name: Compile Rules
        id: compile
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          swift run --package-path tools gins-rules-compiler --root .
          ls -lh compiled/ruleset/mihomo/proxy/ || true

      - name: Build SwiftWasm
        run: |
          cd dashboard/swift-wasm
          SDK_URL="https://download.swift.org/swift-6.3-branch/wasm-sdk/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-05-05-a/swift-6.3-DEVELOPMENT-SNAPSHOT-2026-05-05-a_wasm.artifactbundle.tar.gz"
          curl -L "$SDK_URL" -o wasm-sdk.tar.gz
          CHECKSUM=$(shasum -a 256 wasm-sdk.tar.gz | awk '{print $1}')
          swift sdk install wasm-sdk.tar.gz --checksum "$CHECKSUM"

          # Find the SDK ID and Sysroot path
          SDK_ID=$(swift sdk list | grep "wasm" | head -n 1 | awk '{print $1}')
          WASI_SYSROOT=$(find ~/.swiftpm/swift-sdks -name "wasm32-unknown-wasi" -type d | head -n 1)
          if [ -z "$WASI_SYSROOT" ]; then
            WASI_SYSROOT=$(find ~/Library/Developer/Swift/SDKs -name "wasm32-unknown-wasi" -type d | head -n 1)
          fi

          echo "Using SDK: $SDK_ID"
          echo "Sysroot: $WASI_SYSROOT"

          # Force Clang to use the WASI sysroot via environment and compiler flags
          export WASI_SDK_PATH="$WASI_SYSROOT"
          swift build --swift-sdk "$SDK_ID" --triple wasm32-unknown-wasip1 -c release \
            -Xcc -isysroot -Xcc "$WASI_SYSROOT" \
            -Xcc -I"$WASI_SYSROOT/usr/include"

          mkdir -p ../public/wasm
          built_wasm=$(find .build -name "*.wasm" | grep "release" | head -n 1)
          cp "$built_wasm" ../public/wasm/GinsRulesWasm.wasm

      - name: Build Dashboard
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          cd dashboard
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Sync Rules to R2 (S3 Speed Sync)
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws configure set default.s3.max_concurrent_requests 100
          aws s3 sync compiled/ s3://gins-rules-storage/ \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --delete --no-progress

      - name: Deploy Worker
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --config cmd/scanner/wrangler.jsonc

      - name: Notify
        if: always() && (steps.sync.outputs.changed == 'true' || github.event_name != 'schedule')
        run: |
          SUMMARY=$(cat compiled/ruleset/build-summary.json 2>/dev/null || echo "{\"services\":0,\"rules\":0,\"ipRules\":0,\"asnFiles\":0,\"srs\":0,\"mrs\":0,\"categoryCounts\":{},\"formats\":0,\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          ICONS_HASH=$(cat source/icons-hash.json 2>/dev/null || echo "{}")
          ICONS_TOTAL=$(jq 'length' dashboard/public/icons-catalog.json 2>/dev/null || echo "0")
          PAYLOAD=$(jq -n \
            --arg project "Gins-Rules" \
            --arg run_id "${{ github.run_id }}" \
            --arg sha "${{ github.sha }}" \
            --arg trigger "${{ github.event_name }}" \
            --argjson stats "$SUMMARY" \
            --argjson icons_hash "$ICONS_HASH" \
            --argjson icons_total "$ICONS_TOTAL" \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '$stats + {
              project: $project,
              build: {
                id: $run_id,
                sha: $sha,
                trigger: $trigger
              },
              icons_total: $icons_total,
              artifacts: {
                icons: $icons_hash
              },
              timestamp: $time
            }')
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://rules.ichimarugin728.dev/workflow/build-complete" || true
