name: Build and Deploy

on:
  schedule:
    - cron: "28 23 * * *"
    - cron: "16 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE26: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/gins-rules-engine

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: tools/gins-rules-binary/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26.1.0'
          cache: "pnpm"

      - name: Download Rule Tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin

          MIHOMO_ASSET=$(gh release view Prerelease-Alpha --repo MetaCubeX/mihomo --json assets --jq '.assets[].name | select(test("^mihomo-linux-amd64-alpha-.*\\.gz$"))' | head -n 1)
          gh release download Prerelease-Alpha --repo MetaCubeX/mihomo --pattern "$MIHOMO_ASSET" --dir bin
          gunzip -c "bin/$MIHOMO_ASSET" > bin/mihomo
          rm "bin/$MIHOMO_ASSET"

          SINGBOX_TAG=$(gh release list --repo SagerNet/sing-box --limit 20 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' | head -n 1)
          SINGBOX_ASSET=$(gh release view "$SINGBOX_TAG" --repo SagerNet/sing-box --json assets --jq '.assets[].name | select(test("^sing-box-.*-linux-amd64\\.tar\\.gz$"))' | head -n 1)
          gh release download "$SINGBOX_TAG" --repo SagerNet/sing-box --pattern "$SINGBOX_ASSET" --dir bin
          tar -xzf "bin/$SINGBOX_ASSET" -C bin --strip-components=1 "sing-box-${SINGBOX_TAG#v}-linux-amd64/sing-box"
          rm "bin/$SINGBOX_ASSET"

          chmod +x bin/mihomo bin/sing-box
          bin/mihomo -v
          bin/sing-box version

      - name: Pull Latest Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin main

      - name: Install Dependencies
        run: |
          pnpm install --no-frozen-lockfile
          cd dashboard && pnpm install --no-frozen-lockfile

      - name: Build Tools
        run: |
          cargo build --release --manifest-path tools/gins-rules-engine/Cargo.toml
          (cd tools/gins-rules-binary && go build -o ../../bin/gins-rules-binary .)

      - name: Sync & Compile (Parallel)
        run: |
          pnpm sync &
          SYNC_PID=$!
          pnpm icons &
          ICONS_PID=$!
          wait $SYNC_PID $ICONS_PID

          pnpm compile &
          COMPILE_PID=$!
          (cd dashboard && pnpm build && cp -r dist/* ../compiled/) &
          DASHBOARD_PID=$!
          wait $COMPILE_PID $DASHBOARD_PID

      - name: Commit & Push Changes
        run: |
          git add -A
          git diff --staged --quiet || (
            git commit -m "chore: automated toolchain update [skip ci]"
            for i in {1..5}; do
              git pull --rebase -X theirs origin main && git push && break || sleep 5
            done
          )

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync compiled/ s3://gins-rules-storage/ --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com --delete
          npx wrangler deploy --config cmd/scanner/wrangler.jsonc

      - name: Notify
        if: always()
        run: |
          SUMMARY=$(cat compiled/ruleset/build-summary.json 2>/dev/null || echo "{\"services\":0,\"rules\":0,\"ipRules\":0,\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          ICONS_HASH=$(cat source/icons-hash.json 2>/dev/null || echo "{}")
          PAYLOAD=$(jq -n \
            --arg project "Gins-Rules" \
            --arg run_id "${{ github.run_id }}" \
            --arg sha "${{ github.sha }}" \
            --arg trigger "${{ github.event_name }}" \
            --argjson stats "$SUMMARY" \
            --argjson icons_hash "$ICONS_HASH" \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '$stats + {
              project: $project,
              build: { id: $run_id, sha: $sha, trigger: $trigger },
              artifacts: { icons: $icons_hash },
              timestamp: $time
            }')
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://rules.ichimarugin728.dev/workflow/build-complete" || true
