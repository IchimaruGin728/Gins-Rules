name: Build and Deploy

on:
  schedule:
    - cron: "28 23 * * *"
    - cron: "16 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE26: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools

      - name: Setup Node 26 & pnpm 11
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.9

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"

      - name: Pull Latest Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin main

      - name: Install Dependencies
        run: |
          pnpm install --no-frozen-lockfile
          cd dashboard && pnpm install --no-frozen-lockfile

      - name: Sync Data & Build Matrix (Parallel)
        run: |
          # The Rust binaries run fast enough, we just use pnpm scripts
          pnpm sync & 
          SYNC_PID=$!
          pnpm icons &
          ICONS_PID=$!
          wait $SYNC_PID $ICONS_PID
          
          # 2. Compile Rules & Build Dashboard in parallel
          pnpm compile &
          COMPILE_PID=$!
          (cd dashboard && pnpm build && cp -r dist/* ../compiled/) &
          DASHBOARD_PID=$!
          wait $COMPILE_PID $DASHBOARD_PID

      - name: Commit & Push Changes
        run: |
          git add -A
          git diff --staged --quiet || (
            git commit -m "chore: automated toolchain update [skip ci]"
            for i in {1..5}; do
              git pull --rebase -X theirs origin main && git push && break || sleep 5
            done
          )

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync compiled/ s3://gins-rules-storage/ --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com --delete
          npx wrangler deploy --config cmd/scanner/wrangler.jsonc

      - name: Notify
        if: always()
        run: |
          SUMMARY=$(cat compiled/ruleset/build-summary.json 2>/dev/null || echo "{\"services\":0,\"rules\":0,\"ipRules\":0,\"asnFiles\":0,\"srs\":0,\"mrs\":0,\"categoryCounts\":{},\"formats\":0,\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          ICONS_HASH=$(cat source/icons-hash.json 2>/dev/null || echo "{}")
          PAYLOAD=$(jq -n \
            --arg project "Gins-Rules" \
            --arg run_id "${{ github.run_id }}" \
            --arg sha "${{ github.sha }}" \
            --arg trigger "${{ github.event_name }}" \
            --argjson stats "$SUMMARY" \
            --argjson icons_hash "$ICONS_HASH" \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '$stats + {
              project: $project,
              build: { id: $run_id, sha: $sha, trigger: $trigger },
              artifacts: { icons: $icons_hash },
              timestamp: $time
            }')
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.WORKFLOW_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://rules.ichimarugin728.dev/workflow/build-complete" || true
