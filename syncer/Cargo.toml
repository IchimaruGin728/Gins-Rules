[package]
name = "gins-rules-syncer"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
anyhow = "1.0"
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
url = "2.5"
